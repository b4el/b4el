# Gera a cobrinha comendo as contribuicoes e publica na branch "output".
name: Cobrinha

on:
  schedule:
    - cron: "43 6 * * *"   # todo dia de madrugada
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#FF8A1F
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FF8A1F

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
